<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoDosar">
<title>AutoDosar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1EEE8; --surface: #FFFFFF; --ink: #16130F; --muted: #7A7266; --gold: #8C6E3A; --hair: rgba(140,110,58,.28);
  --ok: #3F7A55; --soon: #A86A1B; --danger: #B4412E; --navbg: #16130F; --navfg: #B9B0A2; --navon: #E7D2A8;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0A09; --surface: #15120F; --ink: #F4EFE6; --muted: #9C9488; --gold: #C9A86A; --hair: rgba(201,168,106,.28); --ok: #9FD8B5; --soon: #E8C27A; --danger: #E5735F; --navbg: #141210; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B0A09; --surface: #15120F; --ink: #F4EFE6; --muted: #9C9488; --gold: #C9A86A; --hair: rgba(201,168,106,.28); --ok: #9FD8B5; --soon: #E8C27A; --danger: #E5735F; --navbg: #141210; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Archivo, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
:root[data-theme="dark"] body { background: radial-gradient(120% 60% at 50% 0%, #241F1A, var(--bg) 60%) fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
#app { max-width: 560px; margin: 0 auto; padding: 14px 18px 40px; }
body.has-nav #app { padding-bottom: 120px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
h1, h2, .serif { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; }
h1 { font-size: 32px; line-height: 1.05; margin: 0; font-weight: 500; }
h2 { font-size: 23px; margin: 26px 0 10px; }
.sub, .muted { color: var(--muted); font-size: 13.5px; margin: 0; display: block; }
.small { font-size: 12.5px; margin-top: 14px; }
.center { text-align: center; }
.caps { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; font-weight: 500; }
.lg { font-size: 20px; }
.num { font-variant-numeric: tabular-nums; }
.gold { color: var(--gold); }
.big { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05; margin: 6px 0; }
.hdr { display: flex; gap: 14px; align-items: center; margin: 6px 0 18px; }
.iconbtn { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; border: 1px solid var(--hair); display: grid; place-items: center; font-size: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.garage { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); padding: 12px 0; }
.garage span { color: var(--gold); }
.hero { text-align: center; }
.hero .caps { margin: 6px 0 4px; }
.name { font-size: clamp(44px, 13vw, 60px); font-weight: 500; }
.stage { display: block; width: 100%; margin: 6px 0 0; background: radial-gradient(50% 60% at 50% 50%, rgba(255,240,220,.09), transparent 70%); }
.car-h { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
.plate { display: inline-flex; align-items: center; gap: 8px; background: #F4EFE6; color: #111; border: 1.5px solid #111; border-radius: 5px; padding: 0 10px 0 0; font-weight: 700; letter-spacing: .12em; font-size: 15px; height: 28px; overflow: hidden; }
.plate .md { background: #0046AE; color: #fff; font-size: 9px; height: 100%; display: grid; place-items: end center; padding: 0 5px 4px; letter-spacing: 0; }
.stats { display: grid; grid-template-columns: 1fr 1.3fr 1fr; margin: 18px 0 6px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.stats button { padding: 14px 4px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.stats button + button { border-left: 1px solid var(--hair); }
.stats span { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.stats b { font-weight: 300; font-size: 25px; font-variant-numeric: tabular-nums; }
.card { display: block; width: 100%; background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 16px; margin: 10px 0; }
:root[data-theme="light"] .card { border-color: transparent; box-shadow: 0 8px 24px rgba(22,19,15,.06); }
.card.flush { padding: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chev { color: var(--gold); font-size: 22px; }
.alert { display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px 16px; margin: 14px 0 0; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--soon) 45%, transparent); background: color-mix(in srgb, var(--soon) 12%, transparent); }
.alert i { width: 7px; height: 7px; border-radius: 50%; background: var(--soon); box-shadow: 0 0 10px var(--soon); flex: 0 0 7px; }
.alert span { flex: 1; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 19px; }
.alert b { font-size: 12px; color: var(--soon); font-weight: 600; }
.list .li { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 2px; border-bottom: 1px solid var(--hair); min-height: 52px; }
.list .li .serif { font-size: 19px; }
.pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.li span.num { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; border: 1.5px solid var(--c); color: var(--c); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.x { width: 40px; height: 40px; border-radius: 50%; color: var(--muted); font-size: 22px; text-align: center; }
.btn { display: block; width: 100%; padding: 15px; border-radius: 16px; background: var(--gold); color: #0B0A09; font-weight: 600; text-align: center; margin: 10px 0; min-height: 52px; }
.btn.danger-bg { background: var(--danger); color: #fff; }
.outline { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--hair); margin: 10px 0; min-height: 52px; font-weight: 500; }
.two > .outline, .two > .btn { justify-content: center; text-align: center; }
.link { display: block; width: 100%; text-align: center; color: var(--gold); padding: 12px; font-weight: 500; }
.link.danger { color: var(--danger); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.three > div { display: flex; flex-direction: column; }
.stat b { font-size: 22px; font-weight: 300; display: block; margin-top: 4px; }
.empty { text-align: center; }
.welcome { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; }
.brand { font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; color: var(--gold); margin-bottom: 18px; }
.welcome .sub { font-size: 16px; margin: 10px 0 24px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); margin: 10px 0; }
input, select, textarea { font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; width: 100%; min-height: 48px; }
textarea.ta { min-height: 140px; font-size: 13px; margin: 10px 0; }
.dlg-in { margin: 10px 0; }
.form label.check { flex-direction: row; align-items: flex-start; gap: 10px; color: var(--ink); }
.check input { width: 22px; height: 22px; min-height: 0; flex: 0 0 22px; accent-color: var(--gold); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 1px solid var(--hair); border-radius: 16px; padding: 12px 14px; margin: 0 !important; color: var(--ink) !important; position: relative; }
.tile input, .chip input, .paints input { position: absolute; opacity: 0; pointer-events: none; }
.tile b { font-size: 15px; }
.tile span { font-size: 12px; color: var(--muted); }
.tile:has(input:checked) { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { margin: 0 !important; position: relative; }
.chip span { display: inline-block; padding: 10px 14px; border: 1px solid var(--hair); border-radius: 12px; color: var(--ink); font-size: 14px; }
.chip:has(input:checked) span { background: var(--gold); color: #0B0A09; border-color: var(--gold); }
.paints { display: flex; flex-wrap: wrap; gap: 12px; }
.paints label { margin: 0 !important; position: relative; }
.paints i { display: block; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair); }
.paints input:checked + i { outline: 3px solid var(--ink); outline-offset: 2px; }
.choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice button { border: 1px solid var(--hair); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 22px; }
.choice button span { font-size: 12.5px; font-weight: 600; text-align: center; }
.choice button.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
.choice button.dim { opacity: .55; }
.warn { border-color: color-mix(in srgb, var(--soon) 45%, transparent); color: var(--soon); font-size: 14px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
.seg button { padding: 10px 14px; border: 1px solid var(--hair); border-radius: 12px; font-size: 14px; min-height: 44px; }
.seg button.on { background: var(--gold); color: #0B0A09; border-color: var(--gold); }
.ring { width: 100%; height: auto; display: block; }
.ring .faint { fill: none; stroke: var(--gold); stroke-opacity: .14; }
.ring .fainter { fill: none; stroke: var(--gold); stroke-opacity: .08; }
.zt { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 16px; fill: var(--ink); }
.zs { font-size: 9.5px; letter-spacing: .04em; font-weight: 600; }
.verdict { text-align: center; font-weight: 500; font-size: 27px; margin: 0 0 4px; }
.showroom { background: linear-gradient(to bottom, color-mix(in srgb, #FFF4E0 14%, transparent), transparent 85%); clip-path: polygon(40% 0, 60% 0, 88% 100%, 12% 100%); padding: 0 0 6px; }
.showroom svg { display: block; height: 360px; margin: 0 auto; }
.pinbg { fill: var(--bg); }
.pinn { font-size: 15px; font-weight: 700; }
.report { display: flex; justify-content: space-between; align-items: flex-end; margin: 12px 0 6px; gap: 10px; }
.score { font-family: "Cormorant Garamond", Georgia, serif; font-size: 54px; color: var(--gold); margin: 0; line-height: .9; }
.score small { font-size: 18px; color: var(--muted); }
.spec { width: 100%; height: auto; display: block; }
.gridl { stroke: var(--gold); stroke-opacity: .07; }
.lead { fill: none; stroke: var(--gold); stroke-opacity: .6; stroke-width: .8; }
.dots button { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 9px 0; }
.dots .serif { font-size: 18px; }
.dots i { flex: 1; border-bottom: 1px dotted var(--hair); transform: translateY(-4px); }
.dots span:last-child { font-size: 12.5px; }
.dl .row { justify-content: space-between; align-items: baseline; }
.days { font-weight: 300; font-size: 30px; }
.days small { font-size: 13px; }
.bar { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--muted) 22%, transparent); margin: 9px 0 7px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.mrow { display: block; width: 100%; padding: 13px 16px; border-top: 1px solid var(--hair); }
.mrow:first-child { border-top: 0; }
.mrow b { font-size: 14.5px; font-weight: 600; }
.mrow .bar { margin-bottom: 0; }
.bars { display: flex; gap: 6px; align-items: flex-end; height: 70px; margin: 12px 0 4px; }
.bars i { flex: 1; background: var(--gold); border-radius: 4px; opacity: .8; }
.gcar.act { border-color: var(--gold); }
.car-s { width: 120px; height: auto; flex: 0 0 120px; }
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 28px)); height: 64px; border-radius: 32px; background: var(--navbg); border: 1px solid rgba(201,168,106,.25); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 20; box-shadow: 0 16px 36px rgba(0,0,0,.35); }
.nav-i { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--navfg); font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; min-height: 48px; justify-content: center; }
.nav-i svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-i.on { color: var(--navon); }
.plus { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; border: 1px solid #C9A86A; color: #E7D2A8; font-size: 28px; font-weight: 200; display: grid; place-items: center; line-height: 1; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 28px)); background: #1E1B17; color: #F4EFE6; border: 1px solid rgba(201,168,106,.35); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; z-index: 40; font-size: 14px; }
#toast[hidden], #sheet[hidden] { display: none; }
#toast span { flex: 1; }
#toast button { color: #E7D2A8; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; padding: 8px; }
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-in { width: min(560px, 100%); background: var(--surface); color: var(--ink); border-radius: 26px 26px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); }
.grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
.grid3 button { border: 1px solid var(--hair); border-radius: 16px; padding: 16px 12px; font-weight: 600; min-height: 56px; }

</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet" hidden></div>
<script>
'use strict';
// ===================== Date și utilitare =====================
const KEY = 'autodosar.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date(new Date().toDateString());
const iso = d => { const z = new Date(d); return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, '0')}-${String(z.getDate()).padStart(2, '0')}`; };
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysUntil = s => Math.round((parseIso(s) - today()) / 864e5);
const fmtDate = s => { const d = parseIso(s); return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`; };
const nf = new Intl.NumberFormat('ro-RO');
const km = n => nf.format(Math.round(n)) + ' km';
const lei = n => nf.format(Math.round(n * 100) / 100) + ' lei';
const one = n => n.toLocaleString('ro-RO', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const daysLabel = n => { const a = Math.abs(n); return a === 1 ? '1 zi' : (a >= 20 && (a % 100 >= 20 || a % 100 === 0)) ? `${a} de zile` : `${a} zile`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.vehicles) return s; } catch (e) {}
  return { vehicles: [], active: null, deadlines: [], fuel: [], expenses: [], readings: [], maint: {}, settings: { theme: 'auto', status: 'ring' } };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Telefonul nu permite salvarea datelor în acest mod de navigare.'); } }

// ===================== Domeniu =====================
const FUELS = [
  ['PETROL', 'Benzină', 'Alimentări în litri'], ['DIESEL', 'Motorină', 'Alimentări în litri'], ['LPG', 'GPL + benzină', 'Ambele, urmărite separat'],
  ['HYBRID', 'Hibrid', 'Se încarcă singur; alimentezi benzină'], ['PHEV', 'Hibrid plug-in', 'Benzină și încărcări de la priză'], ['ELECTRIC', 'Electric', 'Doar încărcări (kWh)'],
];
const BODIES = [['SEDAN', 'Sedan'], ['HATCH', 'Hatchback'], ['WAGON', 'Break'], ['SUV', 'SUV'], ['COUPE', 'Coupé'], ['PICKUP', 'Pickup'], ['VAN', 'Dubă']];
const PAINTS = [['#ECEAE5', 'Alb'], ['#B9BEC6', 'Argintiu'], ['#6B7280', 'Gri'], ['#1F2228', 'Negru'], ['#B91C1C', 'Roșu'], ['#1D4ED8', 'Albastru'], ['#166534', 'Verde'], ['#C8B18A', 'Bej'], ['#E8B21A', 'Galben']];
const energiesOf = f => f === 'LPG' ? ['LPG', 'FUEL'] : f === 'ELECTRIC' ? ['ELECTRIC'] : f === 'PHEV' ? ['FUEL', 'ELECTRIC'] : ['FUEL'];
const energyAction = (e, f) => e === 'ELECTRIC' ? 'Am încărcat' : e === 'LPG' ? 'Am alimentat GPL' : f === 'DIESEL' ? 'Am alimentat motorină' : 'Am alimentat benzină';
const fuelLabel = f => (FUELS.find(x => x[0] === f) || FUELS[0])[1];

function guessBody(make, model) {
  const t = ` ${(make + ' ' + model).toLowerCase().replace(/[^\p{L}\p{N}.+-]+/gu, ' ').trim()} `;
  const W = [['WAGON', 'variant combi kombi touring avant estate break sw tourer allroad'], ['COUPE', 'coupe coupé mustang camaro 911 tt z4 supra gt86 brz'],
    ['PICKUP', 'hilux l200 ranger navara amarok d-max'], ['VAN', 'transit vito sprinter caddy kangoo berlingo partner touran sharan zafira scenic multivan transporter doblo'],
    ['SUV', 'rav4 x1 x3 x5 x6 tiguan touareg sportage sorento tucson duster qashqai x-trail juke cr-v q3 q5 q7 kodiaq karoq outlander forester kuga xc60 xc90 captur cayenne macan evoque cx-5 c-hr 3008 5008 kona'],
    ['HATCH', 'golf polo fabia clio corsa i20 i30 yaris prius auris leaf 208 308 fiesta jazz micra sandero ibiza leon rio ceed swift a1 a3 mini punto c3 megane zoe focus']];
  for (const [b, list] of W) for (const w of list.split(' ')) if (t.includes(` ${w} `)) return b;
  return null;
}
function guessFuel(make, model) {
  const t = ` ${(make + ' ' + model).toLowerCase()} `;
  if (/\b(phev|plug-in|e-hybrid|gte)\b/.test(t)) return 'PHEV';
  if (/\b(leaf|tesla|e-golf|zoe|e-208|ev)\b/.test(t)) return 'ELECTRIC';
  if (/\b(prius|hybrid|hev)\b/.test(t)) return 'HYBRID';
  if (/\b(tdi|cdi|crdi|dci|hdi|tdci|jtd|multijet|d4d|d-4d)\b/.test(t)) return 'DIESEL';
  return null;
}

const DOCS = { RCA: 'Poliță RCA', INSPECTION: 'Inspecție tehnică', GREEN: 'Carte Verde', VIGNETTE: 'Rovinietă', CASCO: 'CASCO', LICENSE: 'Permis de conducere', OTHER: 'Alt termen' };
const CATS = { SERVICE: 'Service', PARTS: 'Piese', INSURANCE: 'Asigurare', FINES: 'Amenzi', PARKING: 'Parcare', WASH: 'Spălătorie', TUNING: 'Tuning / accesorii', OTHER: 'Altele' };
// Planul de întreținere: intervale ORIENTATIVE (manualul mașinii are prioritate)
const MAINT = [
  ['SERVICE', 'Revizie generală', 15000, 12, 'Revizie'], ['OIL', 'Ulei motor și filtru de ulei', 10000, 12, 'Motor'], ['AIR', 'Filtru de aer', 20000, 24, 'Motor'],
  ['FUELF', 'Filtru de combustibil', 40000, 36, 'Motor'], ['PLUGS', 'Bujii', 40000, 48, 'Motor'], ['GLOW', 'Bujii incandescente (verificare)', 100000, 72, 'Motor'],
  ['TIMING', 'Distribuție (curea sau lanț)', 90000, 60, 'Motor'], ['BELT', 'Curea de accesorii', 60000, 48, 'Motor'], ['DPF', 'Filtru de particule DPF (verificare)', 80000, 48, 'Motor'],
  ['COOLANT', 'Antigel', 60000, 48, 'Lichide'], ['BFLUID', 'Lichid de frână', null, 24, 'Lichide'], ['GEAR', 'Ulei cutie de viteze (verificare)', 60000, 48, 'Lichide'],
  ['PADS', 'Plăcuțe de frână (verificare)', 20000, 12, 'Frâne'], ['DISCS', 'Discuri de frână (verificare)', 40000, 24, 'Frâne'],

// ===================== Calcule pentru o mașină =====================

}

    let daysLeft = null; if (intM && m.lastDate) { const d = parseIso(m.lastDate); d.setMonth(d.getMonth() + intM); daysLeft = Math.round((d - today()) / 864e5); }

const maintLabel = m => !m.known ? 'Necompletat' : m.overdue ? 'Restant' : [m.dueIn != null ? `în ~${daysLabel(m.dueIn)}` : null, m.kmLeft != null ? km(m.kmLeft) : null].filter(Boolean).join(' · ') || 'În regulă';

      return { key, title, status: !w.known ? 'Necompletat' : w.overdue ? 'Restant' : (w.dueIn ?? 999) <= 30 ? 'Curând' : 'În regulă', color: maintColor(w) };
    }).filter(Boolean);
    const checked = zones.filter(z => z.color !== 'var(--muted)').length; const overdue = zones.filter(z => z.color === 'var(--danger)').length;
    const verdict = overdue ? `Atenție: ${overdue} restante` : checked === zones.length ? 'Totul e în regulă' : 'Stare bună, dosar incomplet';
    const style = S.settings.status || 'ring';
    const seg = `<div class="seg">${[['ring', 'Inel'], ['showroom', 'Showroom'], ['spec', 'Fișă tehnică']].map(([k, l]) => `<button data-act="statusStyle" data-v="${k}" class="${style === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    const open = z => z.key === 'docs' ? 'deadlines' : 'maint';
    let body = '';
    if (style === 'ring') {
      const ang = { engine: -90, tires: -30, cabin: 30, docs: 90, brakes: 150, battery: -150 }; const cx = 195, cy = 236, R = 112;
      const arcs = zones.map(z => { const a = ang[z.key], r0 = (a - 25) * Math.PI / 180, r1 = (a + 25) * Math.PI / 180, mid = a * Math.PI / 180;
        const far = Math.abs(Math.sin(mid)) > .9 ? 20 : 26; const lx = cx + (R + far) * Math.cos(mid); let ly = cy + (R + far) * Math.sin(mid); if (a === -90) ly -= 10; if (a === 90) ly += 14;
        const an = Math.abs(Math.cos(mid)) < .3 ? 'middle' : Math.cos(mid) > 0 ? 'start' : 'end';
        return `<a href="#" data-go="${open(z)}"><path d="M${cx + R * Math.cos(r0)} ${cy + R * Math.sin(r0)} A${R} ${R} 0 0 1 ${cx + R * Math.cos(r1)} ${cy + R * Math.sin(r1)}" stroke="${z.color}" stroke-width="5" stroke-linecap="round" fill="none"/><text x="${lx}" y="${ly - 2}" text-anchor="${an}" class="zt">${z.title}</text><text x="${lx}" y="${ly + 12}" text-anchor="${an}" class="zs" fill="${z.color}">${z.status}</text></a>`; }).join('');
      body = `<svg class="ring" viewBox="0 0 390 480"><circle cx="${cx}" cy="${cy}" r="${R + 14}" class="faint"/><circle cx="${cx}" cy="${cy}" r="${R - 14}" class="fainter"/>${arcs}<g transform="translate(147 140) scale(.48)">${carInner(v.body, v.paint)}</g></svg>
        <h2 class="verdict">${verdict}</h2><p class="muted center">${checked} din ${zones.length} zone verificate${checked < zones.length ? ` · completează ${zones.length - checked} ca să vezi tot` : ''}</p>
        ${checked < zones.length ? '<button class="outline" data-go="quickfill"><span class="serif lg">Completare rapidă</span><span class="chev">›</span></button>' : ''}`;
    } else if (style === 'showroom') {
      const pins = zones.map((z, i) => { const [x, y] = anchor(v.body, z.key); return `<g><circle cx="${x}" cy="${y}" r="14" class="pinbg" stroke="${z.color}" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" class="pinn" fill="${z.color}">${i + 1}</text></g>`; }).join('');
      body = `<div class="showroom"><svg viewBox="-12 -6 224 432">${carInner(v.body, v.paint)}${pins}</svg></div>
        <div class="list">${zones.map((z, i) => `<button class="li" data-go="${open(z)}"><span class="num" style="--c:${z.color}">${i + 1}</span><span class="serif grow">${z.title}</span>${pill(z.status, z.color)}</button>`).join('')}</div>`;
    } else {
      const tags = zones.map(z => { const [x, y, left] = anchor(v.body, z.key); const X = 118 + x * .75, Y = 18 + y * .75, ex = left ? X - 30 : X + 30, end = left ? 14 : 376;
        return `<path d="M${X} ${Y} L${ex} ${Y - 14} L${end} ${Y - 14}" class="lead"/><circle cx="${X}" cy="${Y}" r="3" fill="${z.color}"/><text x="${end}" y="${Y - 19}" text-anchor="${left ? 'start' : 'end'}" class="zt">${z.title}</text>`; }).join('');
      body = `<div class="report"><div><p class="muted">Raport de stare · ${fmtDate(iso(today()))}</p><p class="serif lg">${esc([v.make, v.model].filter(Boolean).join(' ') || v.name)}${v.year ? ', ' + esc(v.year) : ''}</p></div><p class="score">${score(v)}<small>/100</small></p></div>
        <svg class="spec" viewBox="0 0 390 340"><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" class="gridl"/></pattern></defs><rect width="390" height="340" fill="url(#grid)"/><g transform="translate(118 18) scale(.75)">${carInner(v.body, v.paint, true)}</g>${tags}</svg>
        <div class="dots">${zones.map(z => `<button data-go="${open(z)}"><span class="serif">${z.title}</span><i></i><span style="color:${z.color}">${z.status}</span></button>`).join('')}</div>`;
    }
    return header('Starea mașinii', [v.make, v.model, v.year].filter(Boolean).join(' · ') || v.name) + seg + body;
  },

  deadlines: v => {
    const dls = mine(S.deadlines, v).map(d => Object.assign({}, d, { days: daysUntil(d.expires) })).sort((a, b) => a.days - b.days);
    return `<header class="hdr"><div><h1>Termene</h1><p class="sub">${esc(v.name)}</p></div></header>
      ${dls.length ? dls.map(d => { const c = d.days < 0 ? 'var(--danger)' : d.days <= 30 ? 'var(--soon)' : 'var(--gold)'; return `<button class="card dl" data-go="deadlineForm" data-id="${d.id}"><div class="row"><span class="serif lg">${esc(d.title || DOCS[d.type])}</span><span class="days" style="color:${c}">${d.days < 0 ? 'expirat' : d.days}<small>${d.days < 0 ? '' : ' ' + (d.days === 1 ? 'zi' : 'zile')}</small></span></div><div class="bar"><i style="width:${Math.max(4, Math.min(100, 100 - d.days / 3.65))}%;background:${c}"></i></div><span class="muted">${fmtDate(d.expires)}${d.number ? ' · ' + esc(d.number) : ''}</span></button>`; }).join('')

    ${groupsOf().map(g => { const items = MAINT.filter(m => m[4] === g && maintApplies(m[0], v.fuel)); return items.length ? `<p class="caps">${g}</p><div class="checks">${items.map(m => `<label class="chip"><input type="checkbox" name="k" value="${m[0]}"><span>${m[1]}</span></label>`).join('')}</div>` : ''; }).join('')}
    <button class="btn" type="submit">Salvează</button></form>`,

  more: v => `<header class="hdr"><div><h1>Mai mult</h1><p class="sub">${esc(v.name)}</p></div></header><div class="list">

  garage: v => header('Garajul meu', S.vehicles.length === 1 ? '1 mașină' : S.vehicles.length + ' mașini') + S.vehicles.map(c => `<div class="card gcar ${c.id === v.id ? 'act' : ''}"><div class="row">${carSvg(c, true, 'car-s')}<div class="grow"><b class="serif lg">${esc(c.name)}</b><span class="muted">${esc([c.make, c.model, c.year].filter(Boolean).join(' · '))}</span></div><b class="num">${score(c)}</b></div>
    <div class="two">${c.id !== v.id ? `<button class="btn" data-act="use" data-id="${c.id}">Folosește pe Bord</button>` : '<span class="muted center">Pe Bord</span>'}<button class="outline" data-go="vehicleForm" data-id="${c.id}">Editează</button></div></div>`).join('') + '<button class="outline" data-act="newCar">Adaugă o mașină</button>',

  vehicleForm: (v, id) => {

      <div class="two"><label>An<input name="year" inputmode="numeric" value="${esc(c.year)}"></label><label>Număr<input name="plate" value="${esc(c.plate)}" autocapitalize="characters" placeholder="ORH 482"></label></div>
      <label>Kilometraj actual<input name="km" inputmode="numeric" value="${esc(c.km)}" required></label>
      <p class="caps">Pe ce merge mașina?</p><div class="tiles">${FUELS.map(([k, l, d]) => `<label class="tile"><input type="radio" name="fuel" value="${k}" ${c.fuel === k ? 'checked' : ''} required><b>${l}</b><span>${d}</span></label>`).join('')}</div>
      <p class="caps">Caroseria</p><div class="checks">${BODIES.map(([k, l]) => `<label class="chip"><input type="radio" name="body" value="${k}" ${c.body === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
      <p class="caps">Culoarea</p><div class="paints">${PAINTS.map(([h, l]) => `<label><input type="radio" name="paint" value="${h}" ${c.paint === h ? 'checked' : ''}><i style="background:${h}" title="${l}"></i></label>`).join('')}</div>
      <button class="btn" type="submit">Salvează</button>${id ? `<button type="button" class="link danger" data-act="delCar" data-id="${id}">Șterge mașina</button>` : ''}</form>`;
  },

  settings: () => header('Setări') + `<p class="caps">Aspect</p><div class="seg">${[['auto', 'Ca telefonul'], ['light', 'Luminos'], ['dark', 'Întunecat']].map(([k, l]) => `<button data-act="theme" data-v="${k}" class="${S.settings.theme === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <p class="caps">Copie de rezervă</p><div class="card"><p class="muted">Datele sunt doar în acest browser, pe acest telefon. Fă o copie din când în când și păstreaz-o (de ex. în Notițe).</p><div class="two"><button class="outline" data-act="export">Copiază datele</button><button class="outline" data-act="import">Restaurează</button></div></div>
    <p class="caps">Despre</p><p class="muted">AutoDosar pentru web · fără cont, fără server. Versiunea completă (notificări, OBD-II, widget) e aplicația pentru Android.</p>
    <button class="link danger" data-act="wipe">Șterge toate datele</button>`,
};

// ===================== Ferestre proprii (dialogurile browserului pot fi blocate) =====================
function dialog(title, msg, opts) {
  const o = Object.assign({ input: null, area: false, ok: 'OK', danger: false }, opts || {});
  return new Promise(res => {
    const s = document.getElementById('sheet');
    s.innerHTML = `<div class="sheet-in" role="dialog" aria-modal="true"><p class="serif lg">${esc(title)}</p>${msg ? `<p class="muted">${esc(msg)}</p>` : ''}
      ${o.input !== null ? (o.area ? `<textarea class="ta">${esc(o.input)}</textarea>` : `<input class="dlg-in" inputmode="numeric" value="${esc(o.input)}">`) : ''}
      <div class="two"><button class="outline" data-r="0">Anulează</button><button class="btn ${o.danger ? 'danger-bg' : ''}" data-r="1">${esc(o.ok)}</button></div></div>`;
    s.hidden = false;
    const f = s.querySelector('.dlg-in,.ta'); if (f) setTimeout(() => f.focus(), 50);
    s.onclick = e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== s) return; s.hidden = true; res(b && b.dataset.r === '1' ? (f ? f.value : true) : null); };
  });
}
function sheet() {
  const v = V(); const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sheet-in"><p class="serif lg">Ce adaugi?</p><div class="grid3">${[['fuelForm', v.fuel === 'ELECTRIC' ? 'Încărcare' : 'Alimentare'], ['expenseForm', 'Cheltuială'], ['deadlineForm', 'Termen'], ['quickfill', 'Service făcut']].map(([r, l]) => `<button data-sheet="${r}">${l}</button>`).join('')}</div><button class="link" data-sheet="">Închide</button></div>`;
  s.hidden = false;
  s.onclick = e => { const b = e.target.closest('[data-sheet]'); if (!b && e.target !== s) return; s.hidden = true; if (b && b.dataset.sheet) go(b.dataset.sheet); };
}

// ===================== Acțiuni =====================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go],[data-tab]'); if (!el || el.closest('#sheet')) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.tab) return tab(el.dataset.tab);
  if (el.dataset.go) return go(el.dataset.go, el.dataset.id || el.dataset.preset);
  const v = V(), a = el.dataset.act;
  if (a === 'back') return back();
  if (a === 'add') return sheet();
  if (a === 'newCar') return go('vehicleForm');
  if (a === 'demo') { demo(); save(); return tab('home'); }
  if (a === 'switch') { if (S.vehicles.length < 2) return go('garage'); const i = S.vehicles.indexOf(v); S.active = S.vehicles[(i + 1) % S.vehicles.length].id; save(); return render(); }
  if (a === 'use') { S.active = el.dataset.id; save(); return tab('home'); }
  if (a === 'statusStyle') { S.settings.status = el.dataset.v; save(); return render(); }
  if (a === 'theme') { S.settings.theme = el.dataset.v; save(); return render(); }
  if (a === 'energy') { route.arg = el.dataset.v; return render(); }
  if (a === 'odo') { dialog('Cât arată bordul?', 'Kilometrajul de azi', { input: String(currentKm(v)), ok: 'Salvează' }).then(n => { const k = parseInt(String(n || '').replace(/\D/g, ''), 10); if (!(k > 0)) return; if (k < currentKm(v)) return toast('Kilometrajul nu poate fi mai mic decât ultima citire.'); S.readings.push({ vid: v.id, date: iso(today()), km: k }); save(); render(); toast('Salvat.'); }); return; }
  if (a === 'renew') { const d = S.deadlines.find(x => x.id === el.dataset.id); const before = d.expires; const n = parseIso(d.expires); n.setMonth(n.getMonth() + Number(el.dataset.m)); d.expires = iso(n); save(); back(); return toast(`Reînnoit până la ${fmtDate(d.expires)}.`, () => { d.expires = before; }); }
  if (a === 'delDeadline') { const i = S.deadlines.findIndex(x => x.id === el.dataset.id); const d = S.deadlines.splice(i, 1)[0]; save(); back(); return toast('Termenul a fost șters.', () => S.deadlines.push(d)); }
  if (a === 'delItem') { const arr = el.dataset.kind === 'fuel' ? S.fuel : S.expenses; const i = arr.findIndex(x => x.id === el.dataset.id); const x = arr.splice(i, 1)[0]; save(); render(); return toast('Șters.', () => arr.push(x)); }
  if (a === 'maintDone') { const st = (S.maint[v.id] = S.maint[v.id] || {}); const k = el.dataset.k; const before = st[k] ? Object.assign({}, st[k]) : undefined; st[k] = Object.assign({}, st[k] || {}, { lastKm: currentKm(v), lastDate: iso(today()) }); save(); render(); return toast('Marcat ca făcut azi.', () => { if (before) st[k] = before; else delete st[k]; }); }
  if (a === 'delCar') { const id = el.dataset.id; dialog('Ștergi mașina?', 'Toate termenele, alimentările și cheltuielile ei se șterg definitiv.', { ok: 'Șterge', danger: true }).then(r => { if (!r) return; S.vehicles = S.vehicles.filter(x => x.id !== id); for (const k of ['deadlines', 'fuel', 'expenses', 'readings']) S[k] = S[k].filter(x => x.vid !== id); delete S.maint[id]; S.active = S.vehicles[0] ? S.vehicles[0].id : null; save(); tab('home'); }); return; }
  if (a === 'export') { const txt = JSON.stringify(S); const fallback = () => dialog('Copia datelor', 'Selectează tot textul, copiază-l și păstrează-l (de ex. în Notițe).', { input: txt, area: true, ok: 'Gata' });
    try { navigator.clipboard.writeText(txt).then(() => toast('Datele au fost copiate. Lipește-le în Notițe ca să le păstrezi.'), fallback); } catch (_) { fallback(); } return; }
  if (a === 'import') { dialog('Restaurează datele', 'Lipește aici textul copiat. Datele actuale vor fi înlocuite.', { input: '', area: true, ok: 'Restaurează' }).then(txt => { if (!txt) return; try { const d = JSON.parse(txt); if (!d.vehicles) throw 0; S = d; save(); tab('home'); toast('Datele au fost restaurate.'); } catch (_) { toast('Textul nu e o copie AutoDosar.'); } }); return; }
  if (a === 'wipe') { dialog('Ștergi toate datele?', 'Mașinile și tot istoricul din acest browser se șterg definitiv.', { ok: 'Șterge tot', danger: true }).then(r => { if (!r) return; try { localStorage.removeItem(KEY); } catch (_) {} S = load(); stack = []; route = { name: 'welcome' }; render(); }); return; }
});

document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const d = Object.fromEntries(new FormData(f)); const v = V();
  const num = x => parseFloat(String(x).replace(/\s/g, '').replace(',', '.'));
  const kind = f.dataset.form;
  if (kind === 'vehicle') {
    if (!d.fuel) return toast('Alege pe ce merge mașina.');
    const id = f.dataset.id || uid(); const old = S.vehicles.find(x => x.id === id);
    const car = { id, name: d.name.trim(), make: d.make.trim(), model: d.model.trim(), year: d.year, plate: d.plate.toUpperCase().trim(), fuel: d.fuel, body: d.body || 'SEDAN', paint: d.paint || '#ECEAE5', km: parseInt(String(d.km).replace(/\D/g, ''), 10) || 0 };
    if (old) Object.assign(old, car); else { S.vehicles.push(car); S.active = id; }
    save(); return old ? back() : tab('home');
  }
  if (kind === 'deadline') {
    const id = f.dataset.id; const item = { id: id || uid(), vid: v.id, type: d.type, title: d.title.trim(), expires: d.expires, number: d.number.trim() };
    if (id) Object.assign(S.deadlines.find(x => x.id === id), item); else S.deadlines.push(item);
    save(); back(); return toast('Salvat.');
  }
  if (kind === 'fuel') {
    if (!d.energy) return toast('Alege ce ai făcut: alimentare sau încărcare.');
    const odo = parseInt(String(d.odo).replace(/\D/g, ''), 10); if (!(odo > 0)) return toast('Scrie kilometrajul.');
    S.fuel.push({ id: uid(), vid: v.id, date: d.date, odo, qty: num(d.qty), amount: num(d.amount), full: !!d.full, energy: d.energy }); save();
    const u = energyUse(v, d.energy); back(); return toast(u.avg != null ? `Salvat. Consum real: ${one(u.avg)} ${d.energy === 'ELECTRIC' ? 'kWh' : 'l'}/100 km` : 'Salvat.');
  }
  if (kind === 'expense') { S.expenses.push({ id: uid(), vid: v.id, date: d.date, cat: d.cat, amount: num(d.amount), note: d.note.trim() }); save(); back(); return toast('Salvat.'); }
  if (kind === 'quickfill') {
    const ks = new FormData(f).getAll('k'); if (!ks.length) return toast('Bifează cel puțin o lucrare.');
    const st = (S.maint[v.id] = S.maint[v.id] || {}); const kmv = parseInt(String(d.km).replace(/\D/g, ''), 10) || currentKm(v);
    ks.forEach(k => { st[k] = Object.assign({}, st[k] || {}, { lastKm: kmv, lastDate: d.date }); }); save(); back(); return toast(`Completate: ${ks.length}.`);
  }
});
// Formularul mașinii: motorizarea și caroseria sugerate după model
document.addEventListener('change', e => {
  const f = e.target.form; if (!f || f.dataset.form !== 'vehicle' || !['make', 'model'].includes(e.target.name)) return;
  const fg = guessFuel(f.make.value, f.model.value); if (fg && !f.querySelector('[name=fuel]:checked')) f.querySelector(`[name=fuel][value=${fg}]`).checked = true;
  const bg = guessBody(f.make.value, f.model.value); if (bg && !f.dataset.id) f.querySelector(`[name=body][value=${bg}]`).checked = true;
});

// Mașina demo: un plug-in cu câteva luni de date, ca să vezi tot ce poate aplicația
function demo() {
  const id = uid(); const t = today(); const d = n => iso(new Date(t.getTime() - n * 864e5));
  S.vehicles.push({ id, name: 'Outlander', make: 'Mitsubishi', model: 'Outlander PHEV', year: '2021', plate: 'DEM 001', fuel: 'PHEV', body: 'SUV', paint: '#1D4ED8', km: 58000 }); S.active = id;
  let k = 58000; for (let i = 0; i < 40; i++) { k += 150 + (i % 4) * 15; const day = d(Math.round(180 - i * 4.5));
    if (i % 2 === 0) S.fuel.push({ id: uid(), vid: id, date: day, odo: k, qty: 11.5 + (i % 3), amount: (11.5 + (i % 3)) * 2.46, full: true, energy: 'ELECTRIC' });
    if (i % 5 === 0) S.fuel.push({ id: uid(), vid: id, date: day, odo: k, qty: 24 + (i % 4), amount: (24 + (i % 4)) * 23.9, full: true, energy: 'FUEL' }); }
  S.readings.push({ vid: id, date: d(0), km: k });
  S.expenses.push({ id: uid(), vid: id, date: d(150), cat: 'SERVICE', amount: 3850, note: 'Revizie: ulei, filtre, plăcuțe față' }, { id: uid(), vid: id, date: d(12), cat: 'WASH', amount: 150, note: '' });
  S.deadlines.push({ id: uid(), vid: id, type: 'RCA', expires: d(-9) }, { id: uid(), vid: id, type: 'INSPECTION', expires: d(-41) }, { id: uid(), vid: id, type: 'GREEN', expires: d(-120) });
  S.maint[id] = { SERVICE: { lastKm: k - 8200, lastDate: d(150) }, OIL: { lastKm: k - 8200, lastDate: d(150) }, PADS: { lastKm: k - 8200, lastDate: d(150) }, TIRES: { lastKm: k - 1900, lastDate: d(40) }, BATT: { lastDate: d(100) }, HV: { lastDate: d(100) }, BFLUID: { lastDate: d(800) } };
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
render();
