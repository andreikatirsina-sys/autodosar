<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet" hidden></div>
<script>
// ===================== Poze: păstrate pe telefon (IndexedDB), micșorate înainte de salvare =====================
const PhotoDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('autodosar-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('p', mode); const st = t.objectStore('p'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    put: (id, data) => tx('readwrite', st => st.put(data, id)),
    get: id => tx('readonly', st => st.get(id)),
    del: id => tx('readwrite', st => st.delete(id)),
    all: async () => { const db = await open(); return new Promise(res => { const out = {}; const t = db.transaction('p'); const c = t.objectStore('p').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); }; }); },
    clear: () => tx('readwrite', st => st.clear()),
  };
})();
const photoCache = {};
/** Încarcă pozele afișate pe ecran (elementele <img data-photo="id">), după randare. */
async function hydratePhotos(root) {
  for (const img of root.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo; if (!id) continue;
    if (!photoCache[id]) { try { photoCache[id] = await PhotoDB.get(id); } catch (e) {} }
    if (photoCache[id]) img.src = photoCache[id];
  }
}
/** Micșorează o poză (latura mare max 1400 px, JPEG) și o salvează; întoarce id-ul. */
function savePhotoFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = async () => {
      const k = Math.min(1, 1400 / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); const data = c.toDataURL('image/jpeg', 0.78); const id = 'ph_' + uid();
      try { await PhotoDB.put(id, data); photoCache[id] = data; res(id); } catch (e) { rej(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });

// ===================== Ferestre proprii (dialogurile browserului pot fi blocate) =====================
function dialog(title, msg, opts) {
  const o = Object.assign({ input: null, area: false, ok: 'OK', danger: false, pass: false }, opts || {});
  return new Promise(res => {
    const s = document.getElementById('sheet');
    s.innerHTML = `<div class="sheet-in" role="dialog" aria-modal="true"><p class="serif lg">${esc(title)}</p>${msg ? `<p class="muted">${esc(msg)}</p>` : ''}
      ${o.input !== null ? (o.area ? `<textarea class="ta">${esc(o.input)}</textarea>` : `<input class="dlg-in" ${o.pass ? 'type="password" placeholder="Parolă (opțional)"' : 'inputmode="numeric"'} value="${esc(o.input)}">`) : ''}
      <div class="two"><button class="outline" data-r="0">Anulează</button><button class="btn ${o.danger ? 'danger-bg' : ''}" data-r="1">${esc(o.ok)}</button></div></div>`;
    s.hidden = false; translateDom(s);
    const f = s.querySelector('.dlg-in,.ta'); if (f) setTimeout(() => f.focus(), 50);
    s.onclick = e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== s) return; s.hidden = true; res(b && b.dataset.r === '1' ? (f ? f.value : true) : null); };
  });
}
function sheet() {
  const v = V(); const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sheet-in"><p class="serif lg">Ce adaugi?</p><div class="grid3">${[['fuelForm', v.fuel === 'ELECTRIC' ? 'Încărcare' : 'Alimentare'], ['expenseForm', 'Cheltuială'], ['deadlineForm', 'Termen'], ['quickfill', 'Service făcut'], ['parking', 'Am parcat'], ['record', 'Drum GPS']].map(([r, l]) => `<button data-sheet="${r}">${l}</button>`).join('')}</div><button class="link" data-sheet="">Închide</button></div>`;
  s.hidden = false; translateDom(s);
  s.onclick = e => { const b = e.target.closest('[data-sheet]'); if (!b && e.target !== s) return; s.hidden = true; if (b && b.dataset.sheet) go(b.dataset.sheet); };
}

// ===================== Acțiuni =====================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go],[data-tab]'); if (!el || el.closest('#sheet')) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.tab) return tab(el.dataset.tab);
  if (el.dataset.go) return go(el.dataset.go, el.dataset.id || el.dataset.preset);
  const v = V(), a = el.dataset.act;
  if (a === 'back') return back();
  if (a === 'add') return sheet();
  if (a === 'newCar') return go('vehicleForm');
  if (a === 'demo') { demo(); save(); return tab('home'); }
  if (a === 'switch') { if (S.vehicles.length < 2) return go('garage'); const i = S.vehicles.indexOf(v); S.active = S.vehicles[(i + 1) % S.vehicles.length].id; save(); return render(); }
  if (a === 'use') { S.active = el.dataset.id; save(); return tab('home'); }
  if (a === 'statusStyle') { S.settings.status = el.dataset.v; save(); return render(); }
  if (a === 'theme') { S.settings.theme = el.dataset.v; save(); return render(); }
  if (a === 'lang') { S.settings.lang = el.dataset.v; for (const k in trCache) delete trCache[k]; save(); return render(); }
  if (a === 'energy') { route.arg = el.dataset.v; return render(); }
  if (a === 'odo') { dialog('Cât arată bordul?', 'Kilometrajul de azi', { input: String(currentKm(v)), ok: 'Salvează' }).then(n => { const k = parseInt(String(n || '').replace(/\D/g, ''), 10); if (!(k > 0)) return; if (k < currentKm(v)) return toast('Kilometrajul nu poate fi mai mic decât ultima citire.'); S.readings.push({ vid: v.id, date: iso(today()), km: k }); save(); render(); toast('Salvat.'); }); return; }
  if (a === 'renew') { const d = S.deadlines.find(x => x.id === el.dataset.id); const before = d.expires; const n = parseIso(d.expires); n.setMonth(n.getMonth() + Number(el.dataset.m)); d.expires = iso(n); save(); back(); return toast(`Reînnoit până la ${fmtDate(d.expires)}.`, () => { d.expires = before; }); }
  if (a === 'delDeadline') { const i = S.deadlines.findIndex(x => x.id === el.dataset.id); const d = S.deadlines.splice(i, 1)[0]; save(); back(); return toast('Termenul a fost șters.', () => S.deadlines.push(d)); }
  if (a === 'delItem') { const arr = el.dataset.kind === 'fuel' ? S.fuel : S.expenses; const i = arr.findIndex(x => x.id === el.dataset.id); const x = arr.splice(i, 1)[0]; save(); render(); return toast('Șters.', () => arr.push(x)); }
  if (a === 'maintDone') { const st = (S.maint[v.id] = S.maint[v.id] || {}); const k = el.dataset.k; const before = st[k] ? Object.assign({}, st[k]) : undefined; st[k] = Object.assign({}, st[k] || {}, { lastKm: currentKm(v), lastDate: iso(today()) }); save(); render(); return toast('Marcat ca făcut azi.', () => { if (before) st[k] = before; else delete st[k]; }); }
  if (a === 'delCar') { const id = el.dataset.id; dialog('Ștergi mașina?', 'Toate termenele, alimentările și cheltuielile ei se șterg definitiv.', { ok: 'Șterge', danger: true }).then(r => { if (!r) return; S.vehicles = S.vehicles.filter(x => x.id !== id); for (const k of ['deadlines', 'fuel', 'expenses', 'readings']) S[k] = S[k].filter(x => x.vid !== id); delete S.maint[id]; S.active = S.vehicles[0] ? S.vehicles[0].id : null; save(); tab('home'); }); return; }
  if (a === 'export') { const txt = JSON.stringify(S); const fallback = () => dialog('Copia datelor', 'Selectează tot textul, copiază-l și păstrează-l (de ex. în Notițe).', { input: txt, area: true, ok: 'Gata' });
    try { navigator.clipboard.writeText(txt).then(() => toast('Datele au fost copiate. Lipește-le în Notițe ca să le păstrezi.'), fallback); } catch (_) { fallback(); } return; }
  if (a === 'import') { dialog('Restaurează datele', 'Lipește aici textul copiat. Datele actuale vor fi înlocuite.', { input: '', area: true, ok: 'Restaurează' }).then(txt => { if (!txt) return; try { const d = JSON.parse(txt); if (!d.vehicles) throw 0; S = d; save(); tab('home'); toast('Datele au fost restaurate.'); } catch (_) { toast('Textul nu e o copie AutoDosar.'); } }); return; }
  if (ACTIONS[a]) return ACTIONS[a](el, v);
  if (a === 'wipe') { dialog('Ștergi toate datele?', 'Mașinile și tot istoricul din acest browser se șterg definitiv.', { ok: 'Șterge tot', danger: true }).then(r => { if (!r) return; try { localStorage.removeItem(KEY); } catch (_) {} S = load(); stack = []; route = { name: 'welcome' }; render(); }); return; }
});

document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const d = Object.fromEntries(new FormData(f)); const v = V();
  const num = x => parseFloat(String(x).replace(/\s/g, '').replace(',', '.'));
  const kind = f.dataset.form;
  if (FORMS[kind]) return FORMS[kind](d, f, v);
  if (kind === 'vehicle') {
    if (!d.fuel) return toast('Alege pe ce merge mașina.');
    const id = f.dataset.id || uid(); const old = S.vehicles.find(x => x.id === id);
    const numv = x => { const n = parseFloat(String(x || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) && n > 0 ? n : null; };
    const car = { id, name: d.name.trim(), make: d.make.trim(), model: d.model.trim(), year: d.year, plate: d.plate.toUpperCase().trim(), fuel: d.fuel, body: d.body || 'SEDAN', paint: d.paint || '#ECEAE5', km: parseInt(String(d.km).replace(/\D/g, ''), 10) || 0,
      photo: (FORMDRAFT.car && FORMDRAFT.car.photo) || (old && old.photo) || null, insurer: d.insurer.trim(), insurerPhone: d.insurerPhone.trim(), price: numv(d.price), bought: d.bought || '', value: numv(d.value) };
    FORMDRAFT.car = null;
    if (old) Object.assign(old, car); else { S.vehicles.push(car); S.active = id; }
    save(); return old ? back() : tab('home');
  }
  if (kind === 'deadline') {
    const id = f.dataset.id; const item = { id: id || uid(), vid: v.id, type: d.type, title: d.title.trim(), expires: d.expires, number: d.number.trim() };
    if (id) Object.assign(S.deadlines.find(x => x.id === id), item); else S.deadlines.push(item);
    save(); back(); return toast('Salvat.');
  }
  if (kind === 'fuel') {

/** Traseul desenat ca linie aurie pe o grilă (fără hărți externe). */
function routeSvg(pts, h = 220) {
  if (!pts || pts.length < 2) return '';
  const lats = pts.map(p => p[0]), lngs = pts.map(p => p[1]); const midLat = (Math.min(...lats) + Math.max(...lats)) / 2; const kx = Math.cos(midLat * Math.PI / 180);

  const W = 360, pad = 18, span = Math.max(maxX - minX, maxY - minY, 1e-6); const s = Math.min((W - 2 * pad) / Math.max(maxX - minX, 1e-6), (h - 2 * pad) / Math.max(maxY - minY, 1e-6), (W - 2 * pad) / span * 4);

  return `<svg class="route" viewBox="0 0 ${W} ${h}"><defs><pattern id="rg" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" class="gridl"/></pattern></defs><rect width="${W}" height="${h}" fill="url(#rg)"/>
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="6" fill="var(--ok)"/><circle cx="${P[P.length - 1][0]}" cy="${P[P.length - 1][1]}" r="6" fill="var(--danger)"/></svg>`;

// ===================== Costul real al mașinii =====================
function spendIn(v, fromIso, toIso) {
  const inR = x => x.date >= fromIso && (!toIso || x.date < toIso);
  return mine(S.fuel, v).filter(inR).reduce((s, f) => s + f.amount, 0) + mine(S.expenses, v).filter(inR).reduce((s, e) => s + e.amount, 0);
}
function kmBetween(v, fromIso) {
  const pts = mine(S.readings, v).map(r => [r.date, r.km]).concat(mine(S.fuel, v).map(f => [f.date, f.odo])).filter(p => p[0] >= fromIso).sort((a, b) => a[0] < b[0] ? -1 : 1);
  return pts.length >= 2 ? pts[pts.length - 1][1] - pts[0][1] : 0;
}

    const bars = []; for (let i = 11; i >= 0; i--) { const a = new Date(today().getFullYear(), today().getMonth() - i, 1), b = new Date(today().getFullYear(), today().getMonth() - i + 1, 1); bars.push([a.getMonth(), spendIn(v, iso(a), iso(b))]); }
    const mx = Math.max(1, ...bars.map(b => b[1]));

    return header('Costul real', v.name) + `<div class="card"><p class="caps">Te costă pe lună</p><p class="big gold">${lei(perMonth)}</p><p class="muted">${dep != null ? 'întreținere + depreciere' : 'doar întreținerea (adaugă valoarea mașinii pentru depreciere)'}</p>

      <p class="caps">Pe categorii</p><div class="card flush">${Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, s]) => `<div class="mrow"><div class="row"><span class="grow">${CATS[k] || k}</span><b class="num">${lei(s)}</b></div><div class="bar"><i style="width:${s / Math.max(...Object.values(cats)) * 100}%;background:var(--gold)"></i></div></div>`).join('') || '<p class="muted pad">Nicio cheltuială în ultimele 12 luni.</p>'}</div>

const BANK_RULES = [
  ['FUEL', /petrom|lukoil|rompetrol|bemol|tirex|avante|mobil|shell|omv|benzin|azs|азс|fuel|carburant|motorina/i],
  ['PARKING', /parcare|parking|парков/i], ['WASH', /spalator|spălător|wash|мойк/i],
  ['SERVICE', /service|servis|сервис|auto ?parts|piese|vulcaniz|шиномонт/i],
  ['INSURANCE', /moldasig|donaris|grawe|asito|general asigur|asigur|insur|rca|страх/i], ['FINES', /amend|politia|poliția|штраф|fine/i],
];
let BANK = null;
function parseCsv(text) {
  const first = text.split(/\r?\n/)[0] || ''; const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === sep) { row.push(cell); cell = ''; } else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (c !== '\r') cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseBank(text) {
  const rows = parseCsv(text); if (rows.length < 2) return [];
  const head = rows[0].map(h => h.toLowerCase());
  const find = re => head.findIndex(h => re.test(h));
  const di = find(/dat|date|дата/), ai = find(/sum|amount|сумм|debit|valoare/), ti = find(/descr|detal|details|назнач|описан|merchant|comerciant|beneficiar/);
  const out = [];
  for (const r of rows.slice(1)) {
    const ds = (r[di] || '').trim(); let m = ds.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/); let date = null;
    if (m) date = `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; else if ((m = ds.match(/(\d{4})-(\d{2})-(\d{2})/))) date = m[0];
    const amt = parseFloat(String(r[ai] || '').replace(/\s/g, '').replace(/[^\d,.-]/g, '').replace(',', '.'));
    const desc = (ti >= 0 ? r[ti] : r.join(' ')) || '';
    if (!date || !isFinite(amt) || amt === 0) continue;
    const rule = BANK_RULES.find(([, re]) => re.test(desc)); if (!rule) continue;
    out.push({ date, amount: Math.abs(amt), desc: desc.trim().slice(0, 80), cat: rule[0], on: true });
  }
  return out;
}

ACTIONS.importFile = async () => {
  const f = await pickFile('.json,application/json,text/plain'); if (!f) return; let text = await f.text();
  try { let o = JSON.parse(text);
    if (o.enc) { const pw = await dialog('Copia e protejată cu parolă', 'Scrie parola folosită la salvare.', { input: '', ok: 'Restaurează', pass: true }); if (!pw) return; text = await decryptText(text, pw); if (!text) return toast('Parola nu e corectă.'); o = JSON.parse(text); }
    const st = o.state || o; if (!st.vehicles) throw 0;
    if (o.photos) { await PhotoDB.clear(); for (const [k, val] of Object.entries(o.photos)) await PhotoDB.put(k, val); }
    S = st; save(); tab('home'); toast('Copia a fost restaurată.');
  } catch (e) { toast('Fișierul nu este o copie AutoDosar.'); }
};

те место парковки или используете замер 0–100 и эко-оценку, пока экран открыт. Bluetooth: только для выбранного вами адаптера OBD-II. Уведомления: для сроков.", "Scanarea documentelor (ML Kit)": "Сканирование документов (ML Kit)", "Textul de pe documente se citește pe telefon cu ML Kit de la Google; pozele și textul nu sunt trimise. ML Kit trimite către Google date tehnice de diagnosticare (modelul telefonului, versiunea aplicației, un identificator de instalare, performanța), criptat, fără a le transmite altor firme.": "Текст документов распознаётся на телефоне с помощью ML Kit от Google; фото и текст не отправляются. ML Kit передаёт в Google технические диагностические данные (модель телефона, версию приложения, идентификатор установки, производительность) в зашифрованном виде, не передавая их другим компаниям.", "Banca": "Банк", "Aplicația nu se conectează la bancă și nu cere parole. Importul se face doar din fișierele sau mesajele pe care le alegi tu.": "Приложение не подключается к банку и не запрашивает пароли. Импорт выполняется только из файлов или сообщений, которые вы выбрали.", "Copia de rezervă": "Резервная копия", "Copia de rezervă se salvează unde alegi tu (de exemplu Google Drive). Ai grijă unde o păstrezi: conține toate datele mașinii.": "Резервная копия сохраняется туда, куда вы выберете (например, на Google Диск). Храните её бережно: в ней все данные машины.", "Hărțile": "Карты", "Pentru afișarea hărților, aplicația descarcă imagini de hartă de la furnizorul de hărți (implicit OpenStreetMap). Cererea conține zona afișată pe hartă și adresa IP a telefonului; traseele și locurile tale nu sunt trimise.": "Для показа карт приложение загружает изображения карты у поставщика (по умолчанию OpenStreetMap). Запрос содержит отображаемую область карты и IP-адрес телефона; ваши маршруты и места не отправляются.", "Ștergerea datelor": "Удаление данных", "Poți șterge oricând o mașină cu toate datele ei din aplicație, sau toate datele, dezinstalând aplicația.": "Вы можете в любой момент удалить машину со всеми её данными в приложении или все данные, удалив приложение.", "Contact: adresa de e-mail din pagina aplicației în Google Play.": "Контакт: адрес e-mail на странице приложения в Google Play.", "Înregistrează drumul": "Запись поездки", "Înregistrez drumul…": "Записываю поездку…", "Înregistrarea drumului": "Запись поездки", "Nu actualiza": "Не обновлять", "Oprește și salvează": "Остановить и сохранить", "Salvez…": "Сохраняю…", "Am găsit un drum neterminat": "Найдена незавершённая поездка", "Aplicația a fost oprită în timpul înregistrării. Îl poți salva sau șterge.": "Приложение было остановлено во время записи. Поездку можно сохранить или удалить.", "Telefonul înregistrează traseul cu GPS-ul cât timp mergi, chiar cu ecranul stins. Vezi o notificare permanentă; o oprești de acolo sau de aici.": "Телефон записывает маршрут по GPS, пока вы едете, даже с выключенным экраном. Видно постоянное уведомление; остановить можно там или здесь.", "Înregistrarea are nevoie de locația precisă (GPS).": "Для записи нужна точная геолокация (GPS).", "Drumul e prea scurt ca să fie salvat.": "Поездка слишком короткая для сохранения.", "Plecare": "Отправление", "Sosire": "Прибытие", "Distanța": "Расстояние", "Durata": "Длительность", "Viteza medie": "Средняя скорость", "Viteza maximă": "Максимальная скорость", "Carburant estimat": "Топливо (оценка)", "Apare după ce ai cel puțin două alimentări cu plinul.": "Появится после как минимум двух заправок до полного бака.", "Șterge drumul": "Удалить поездку", "Aproape de mine": "Рядом со мной", "Benzinării": "АЗС", "Service auto": "Автосервис", "Vulcanizare": "Шиномонтаж", "Parcări": "Парковки", "Drum GPS": "Поездка GPS", "Înregistrează cu GPS": "Записать по GPS", "Înregistrez drumul — atinge ca să vezi harta": "Записываю поездку — нажмите, чтобы открыть карту", "Hărți": "Карты", "Adresa plăcilor de hartă": "Адрес тайлов карты", "Atribuire": "Атрибуция", "Salvează setările hărții": "Сохранить настройки карты", "Adresa trebuie să conțină {z}, {x} și {y}.": "Адрес должен содержать {z}, {x} и {y}.", "Hărțile vin de la serverele OpenStreetMap. Pentru o aplicație publicată cu mulți utilizatori, OpenStreetMap cere folosirea altui furnizor: pune aici adresa plăcilor ({z}/{x}/{y}) și textul de atribuire de la furnizor.": "Карты загружаются с серверов OpenStreetMap. Для опубликованного приложения с множеством пользователей OpenStreetMap требует другого поставщика: укажите здесь адрес тайлов ({z}/{x}/{y}) и текст атрибуции поставщика.", "Hartă": "Карта", "Ulei motor și filtru de ulei": "Моторное масло и масляный фильтр", "Filtru de aer": "Воздушный фильтр", "Filtru de habitaclu": "Салонный фильтр", "Filtru de combustibil": "Топливный фильтр", "Bujii": "Свечи зажигания", "Distribuție (curea/lanț)": "ГРМ (ремень/цепь)", "Plăcuțe și discuri de frână (verificare)": "Тормозные колодки и диски (проверка)", "Lichid de frână": "Тормозная жидкость", "Antigel": "Антифриз", "Baterie (verificare)": "Аккумулятор (проверка)", "Anvelope (verificare uzură și presiune)": "Шины (износ и давление)", "Aer condiționat (igienizare, încărcare)": "Кондиционер (чистка, заправка)", "fără istoric — atinge ca să completezi": "нет истории — нажмите, чтобы заполнить", "restant": "просрочено", "Planul de întreținere": "План обслуживания", "Intervalele sunt orientative (valori uzuale). Ajustează-le după manualul mașinii tale: atinge o lucrare.": "Интервалы ориентировочные (типичные значения). Настройте их по руководству вашей машины: нажмите на работу.", "Când salvezi un service, bifezi ce s-a făcut, iar planul se actualizează singur.": "При сохранении сервиса отметьте, что сделано, — план обновится сам.", "Interval": "Интервал", "La câți km": "Через сколько км", "La câte luni": "Через сколько месяцев", "Ultima dată făcut": "Последний раз сделано", "La kilometrajul": "На пробеге", "Urmăresc": "Отслеживать", "Nu se aplică": "Не применяется", "Făcut azi": "Сделано сегодня", "Completează intervalul în km sau în luni.": "Укажите интервал в км или месяцах.", "Ce s-a făcut? (actualizează planul de întreținere)": "Что сделано? (обновит план обслуживания)", "Salvat. Planul de întreținere a fost actualizat.": "Сохранено. План обслуживания обновлён.", "Atinge ca să vezi ce urmează": "Нажмите, чтобы посмотреть, что предстоит", "Completează când ai făcut ultimul service": "Укажите, когда был последний сервис", "Permis de conducere": "Водительское удостоверение", "Trusă medicală": "Аптечка", "Extinctor": "Огнетушитель", "Certificat de înmatriculare": "Техпаспорт", "Seiful de documente": "Сейф документов", "Seif": "Сейф", "fără termen": "без срока", "Poze document": "Фото документа", "Față": "Лицевая", "Verso": "Оборот", "Pozele documentelor rămân doar în aplicație (nu în galerie). Utile la un control în trafic sau la service.": "Фото документов хранятся только в приложении (не в галерее). Пригодятся при проверке на дороге или в сервисе.", "Tot istoricul": "Вся история", "Istoric": "История", "Caută": "Поиск", "ex. plăcuțe, Petrom, Iași": "напр. колодки, Petrom, Яссы", "Alimentări": "Заправки", "Alte cheltuieli": "Другие расходы", "Drumuri": "Поездки", "3 luni": "3 месяца", "Anul acesta": "Этот год", "Tot": "Всё", "Nimic găsit pentru aceste filtre.": "По этим фильтрам ничего не найдено.", "Tot istoricul (căutare și filtre)": "Вся история (поиск и фильтры)", "Atinge o înregistrare ca s-o modifici; ține apăsat ca s-o ștergi.": "Нажмите на запись, чтобы изменить; удерживайте, чтобы удалить.", "Atinge un drum ca să-l vezi sau să-l modifici; ține apăsat ca să-l ștergi. Exportul se deschide în Excel sau Google Sheets.": "Нажмите на поездку, чтобы открыть или изменить; удерживайте, чтобы удалить. Экспорт открывается в Excel или Google Таблицах.", "Editează cheltuiala": "Изменить расход", "Editează alimentarea": "Изменить заправку", "Editează drumul": "Изменить поездку", "Anul tău cu mașina": "Ваш год с машиной", "Anul meu": "Мой год", "Kilometri": "Километры", "Consum": "Расход", "Pe luni": "По месяцам", "Cea mai mare cheltuială": "Самый большой расход", "ANUL MEU CU MAȘINA": "МОЙ ГОД С МАШИНОЙ", "Cheltuit": "Потрачено", "Categorie": "Категория", "Descriere": "Описание", "Exportă tot în CSV (Excel)": "Экспорт всего в CSV (Excel)", "Ora notificărilor": "Время уведомлений", "Ce notificări primești": "Какие уведомления получать", "Întreținere": "Обслуживание", "Kilometraj (duminica)": "Пробег (по воскресеньям)", "Ajutor și întrebări frecvente": "Помощь и частые вопросы", "Șterge toate datele": "Удалить все данные", "Ștergi toate datele?": "Удалить все данные?", "Se șterg definitiv toate mașinile, termenele, cheltuielile, drumurile și pozele. Fă înainte o copie de rezervă dacă vrei să le păstrezi.": "Будут удалены все машины, сроки, расходы, поездки и фото. Сначала сделайте резервную копию, если хотите их сохранить.", "Șterge tot": "Удалить всё", "Ești sigur?": "Вы уверены?", "Acțiunea nu poate fi anulată.": "Это действие нельзя отменить.", "Da, șterge tot": "Да, удалить всё", "Bordul și scorul": "Панель и оценка", "Scorul de la 0 la 100 îți arată dintr-o privire dacă documentele, service-ul și kilometrajul sunt la zi. Atinge-l ca să vezi ce să faci ca să ajungi la 100.": "Оценка от 0 до 100 сразу показывает, в порядке ли документы, сервис и пробег. Нажмите на неё, чтобы узнать, как получить 100.", "Termene fără grijă": "Сроки без забот", "Adaugă RCA, inspecția, Carte Verde. Poți fotografia polița: data se completează singură. Primești notificări din timp.": "Добавьте RCA, техосмотр, Зелёную карту. Полис можно сфотографировать — дата заполнится сама. Уведомления придут заранее.", "Întreținere și cheltuieli": "Обслуживание и расходы", "Planul de întreținere îți spune când urmează uleiul, filtrele sau distribuția. La un service bifezi ce s-a făcut. Cheltuielile se pot importa și din extrasul băncii.": "План обслуживания подскажет, когда менять масло, фильтры или ГРМ. В сервисе отмечаете, что сделано. Расходы можно импортировать из банковской выписки.", "Unelte pentru drum": "Инструменты в дорогу", "Înregistrează drumurile cu GPS, salvează locul de parcare, diagnoză OBD-II, cronometru 0–100. Butonul + din mijloc adaugă orice; ține-l apăsat ca să dictezi.": "Запись поездок по GPS, место парковки, диагностика OBD-II, замер 0–100. Кнопка + в центре добавляет что угодно; удерживайте её, чтобы продиктовать.", "Următorul": "Далее", "Începe": "Начать", "Sari peste": "Пропустить", "Ajutor": "Помощь", "Întrebări frecvente": "Частые вопросы", "Vezi din nou turul": "Показать тур ещё раз", "Unde sunt păstrate datele mele?": "Где хранятся мои данные?", "Doar pe telefonul tău. Aplicația nu are cont și nu are server. Pentru telefon nou folosește Setări → Copie de rezervă.": "Только на вашем телефоне. У приложения нет аккаунта и сервера. Для нового телефона используйте Настройки → Резервная копия.", "De ce nu primesc notificări?": "Почему не приходят уведомления?", "Verifică Setări → Notificări în aplicație și permisiunea de notificări a telefonului. Unele telefoane opresc aplicațiile în fundal: scoate AutoDosar din economisirea bateriei.": "Проверьте Настройки → Уведомления в приложении и разрешение на уведомления в телефоне. Некоторые телефоны останавливают фоновые приложения: исключите AutoDosar из экономии батареи.", "Cum se calculează consumul real?": "Как считается реальный расход?", "Între două alimentări cu plinul: litrii puși după primul plin împărțiți la kilometrii parcurși. Bifează „Da, plin” când faci plinul.": "Между двумя полными заправками: литры после первого полного бака делятся на пройденные километры. Отмечайте «Да, полный», когда заправляете полный бак.", "Ce înseamnă scorul mașinii?": "Что означает оценка машины?", "Documente valabile (40), service la zi (30), kilometraj actualizat (20), istoric (10). Atinge scorul pe Bord ca să vezi ce lipsește.": "Действующие документы (40), сервис вовремя (30), обновлённый пробег (20), история (10). Нажмите на оценку на панели, чтобы увидеть, чего не хватает.", "Cum modific o înregistrare greșită?": "Как исправить ошибочную запись?", "Atinge-o în Cheltuieli sau în Tot istoricul; se deschide formularul cu butoanele Salvează și Șterge.": "Нажмите на неё в Расходах или во Всей истории — откроется форма с кнопками Сохранить и Удалить.", "Ce adaptor OBD-II îmi trebuie?": "Какой адаптер OBD-II нужен?", "Un adaptor ELM327 cu Bluetooth (nu doar Wi-Fi), împerecheat din setările Bluetooth ale telefonului.": "Адаптер ELM327 с Bluetooth (не только Wi-Fi), сопряжённый в настройках Bluetooth телефона.", "Cum import cheltuielile din bancă?": "Как импортировать расходы из банка?", "Exportă extrasul ca fișier CSV din aplicația băncii, apoi Cheltuieli → Din bancă. Sau, la o plată din aplicația băncii, Partajează → AutoDosar.": "Выгрузите выписку в CSV из приложения банка, затем Расходы → Из банка. Или у платежа в приложении банка: Поделиться → AutoDosar.", "Intervalele de întreținere sunt exacte?": "Интервалы обслуживания точные?", "Sunt orientative. Ajustează-le după manualul mașinii: Întreținere → atinge lucrarea.": "Они ориентировочные. Настройте их по руководству машины: Обслуживание → нажмите на работу.", "Golește": "Очистить", "Expiră pe": "Истекает", "Data (opțional)": "Дата (необязательно)", "Se afișează primele 200. Restrânge căutarea.": "Показаны первые 200. Уточните поиск.", "GPS-ul nu este disponibil pe acest telefon.": "GPS недоступен на этом телефоне.", "Aplicația s-a oprit neașteptat": "Приложение неожиданно остановилось", "Ne ajuți să reparăm problema? Raportul conține doar detalii tehnice (versiunea, modelul telefonului, locul erorii), nu datele tale.": "Поможете исправить проблему? Отчёт содержит только технические сведения (версия, модель телефона, место ошибки), без ваших данных.", "Trimite raportul": "Отправить отчёт", "Nu acum": "Не сейчас", "Ceva n-a mers pe acest ecran": "На этом экране что-то пошло не так", "Datele tale sunt în siguranță. Întoarce-te la Bord; poți trimite raportul ca să reparăm problema.": "Ваши данные в безопасности. Вернитесь на панель; можно отправить отчёт, чтобы мы исправили проблему.", "Înapoi la Bord": "Назад на панель", "Setări baterie": "Настройки батареи", "Notificările întârzie? Unele telefoane opresc aplicațiile în fundal pentru a economisi bateria. Alege AutoDosar → „Fără restricții”.": "Уведомления опаздывают? Некоторые телефоны останавливают фоновые приложения ради экономии батареи. Выберите AutoDosar → «Без ограничений».", "Garajul meu": "Мой гараж", "1 mașină": "1 машина", "Toate mașinile": "Все машины", "luna aceasta": "в этом месяце", "anul acesta": "в этом году", "Fiecare mașină are separat termenele, cheltuielile, drumurile, întreținerea și documentele ei. Atinge o mașină ca s-o folosești pe Bord.": "У каждой машины свои сроки, расходы, поездки, обслуживание и документы. Нажмите на машину, чтобы показать её на панели.", "Pe Bord": "На панели", "Folosește pe Bord": "Показать на панели", "Termene în următoarele 30 de zile": "Сроки в ближайшие 30 дней", "Alege mașina": "Выберите машину", "Pentru mașina": "Для машины", "Automat": "Авто", "Turcoaz": "Бирюзовый", "Indigo": "Индиго", "SCOR": "ОЦЕНКА", "KILOMETRAJ": "ПРОБЕГ", "CONSUM": "РАСХОД", "Adaugă numărul și poza": "Добавьте номер и фото", "Starea mașinii": "Состояние машины", "Motor": "Двигатель", "Frâne": "Тормоза", "Anvelope": "Шины", "Habitaclu": "Салон", "lipsesc": "отсутствуют", "OK": "OK", "în regulă": "в порядке", "curând": "скоро", "Totul e la zi.": "Всё в порядке.", "Atinge un punct de pe mașină ca să vezi lucrările sau documentele.": "Нажмите на точку на машине, чтобы увидеть работы или документы.", "Șampanie": "Шампань", "Întunecat": "Тёмная", "Culoarea de accent": "Цвет акцента", "Cupru": "Медь", "KILOMETRI": "КИЛОМЕТРЫ", "Fonturi: Archivo, IBM Plex Mono și Cormorant Garamond (SIL Open Font License 1.1).": "Шрифты: Archivo, IBM Plex Mono и Cormorant Garamond (SIL Open Font License 1.1).", "Am anulat.": "Отменено.", "Alimentarea a fost ștearsă.": "Заправка удалена.", "Cheltuiala a fost ștearsă.": "Расход удалён.", "Drumul a fost șters.": "Поездка удалена.", "Termenul a fost șters.": "Срок удалён.", "Marcat ca făcut azi.": "Отмечено как сделанное сегодня.", "Fără limită de timp.": "Без ограничения по времени.", "Schimbă ora": "Изменить время", "Parcarea s-a încheiat.": "Парковка завершена.", "Alege ora până la care ai plătit": "Выберите время, до которого оплачено", "Revizie": "ТО", "Lichide": "Жидкости", "Roți și suspensie": "Колёса и подвеска", "Electrice și lumini": "Электрика и свет", "Revizie generală": "Общее ТО", "Distribuție (curea sau lanț)": "ГРМ (ремень или цепь)", "Curea de accesorii": "Ремень навесного оборудования", "Bujii incandescente (verificare)": "Свечи накаливания (проверка)", "Filtru de particule DPF (verificare)": "Сажевый фильтр DPF (проверка)", "Ulei cutie de viteze (verificare)": "Масло в коробке передач (проверка)", "Lichid servodirecție (verificare)": "Жидкость ГУР (проверка)", "Plăcuțe de frână (verificare)": "Тормозные колодки (проверка)", "Discuri de frână (verificare)": "Тормозные диски (проверка)", "Anvelope: uzură și presiune": "Шины: износ и давление", "Rotirea anvelopelor": "Перестановка шин", "Geometria roților": "Развал-схождение", "Amortizoare și suspensie (verificare)": "Амортизаторы и подвеска (проверка)", "Baterie 12 V (verificare)": "Аккумулятор 12 В (проверка)", "Baterie de tracțiune (verificare)": "Тяговая батарея (проверка)", "Faruri și becuri (verificare)": "Фары и лампы (проверка)", "Lamele ștergătoare": "Щётки стеклоочистителя", "Necompletat": "Не заполнено", "Restant": "Просрочено", "În regulă": "В порядке", "Totul e în regulă": "Всё в порядке", "completate": "заполнено", "Completează când s-a făcut ultima dată fiecare lucrare, ca să știi ce urmează. Cel mai rapid: bifezi deodată ce s-a făcut la ultimul service.": "Укажите, когда последний раз выполнялась каждая работа, чтобы знать, что впереди. Быстрее всего — отметить сразу всё, что сделали на последнем ТО.", "Completare rapidă": "Быстрое заполнение", "Intervalele sunt orientative (valori uzuale). Atinge o lucrare ca să le potrivești după manualul mașinii. La un service, bifezi ce s-a făcut și planul se actualizează singur.": "Интервалы ориентировочные (типичные значения). Нажмите на работу, чтобы настроить их по руководству машины. При сервисе отметьте, что сделано, — план обновится сам.", "Ce s-a făcut la ultimul service? Bifează lucrările; le salvăm cu data și kilometrajul de mai jos.": "Что сделали на последнем ТО? Отметьте работы — сохраним их с датой и пробегом ниже.", "Data service-ului": "Дата ТО", "Kilometrajul atunci": "Пробег тогда", "Bifează cel puțin o lucrare.": "Отметьте хотя бы одну работу.", "Electrice": "Электрика", "Roți": "Колёса", "necompletat": "не заполнено", "Adaugă RCA și inspecția tehnică": "Добавьте RCA и техосмотр", "Completează planul de întreținere": "Заполнить план обслуживания", "GPL + benzină": "Газ + бензин", "Hibrid plug-in": "Подключаемый гибрид", "Încărcare": "Зарядка", "Editează încărcarea": "Изменить зарядку", "Ce ai pus?": "Что заправили?", "kWh": "кВт·ч", "Da, 100%": "Да, 100%", "Acasă": "Дома", "Stație publică": "Публичная станция", "La serviciu": "На работе", "Scrie kWh-ii din aplicația stației sau de pe contorul încărcătorului de acasă. Acasă: kWh × tariful tău = suma.": "Укажите кВт·ч из приложения станции или со счётчика домашней зарядки. Дома: кВт·ч × ваш тариф = сумма.", "Încărcat la 100%? (consumul exact se calculează între două încărcări complete)": "Заряжено до 100%? (точный расход считается между двумя полными зарядками)", "Scrie câți kWh.": "Укажите кВт·ч.", "Încărcarea a fost ștearsă.": "Зарядка удалена.", "Consum și costuri": "Расход и затраты", "Costul energiei la 100 km": "Стоимость энергии на 100 км", "Apare după două alimentări sau încărcări cu plinul / la 100%.": "Появится после двух полных заправок или зарядок до 100%.", "Cost / 100 km": "Цена / 100 км", "la 100 km": "на 100 км", "la 100 km · aproximativ": "на 100 км · примерно", "Adaugă o încărcare": "Добавить зарядку", "Adaugă o alimentare": "Добавить заправку", "Cum calculăm": "Как мы считаем", "Energie estimată": "Энергия (оценка)", "De la plin la plin: tot ce ai pus după un plin (sau o încărcare la 100%), până la următorul plin inclusiv, împărțit la kilometrii parcurși între ele. E metoda cea mai precisă fără senzori.": "От полного до полного: всё, что залито после полного бака (или зарядки до 100%) до следующего полного включительно, делится на пройденные километры. Самый точный способ без датчиков.", "La plug-in, benzina și curentul se măsoară fiecare pe toți kilometrii (și pe cei electrici), deci suma lor e costul real. Cu cât încarci mai des, cu atât scade consumul de benzină.": "У подключаемого гибрида бензин и электричество считаются на все километры (и электрические), поэтому их сумма — реальная стоимость. Чем чаще заряжаете, тем меньше расход бензина.", "La GPL, motorul consumă și puțină benzină (pornirea la rece, comutarea): de aceea le urmărim separat.": "На газу двигатель потребляет и немного бензина (холодный пуск, переключение), поэтому считаем их отдельно.", "La încărcare scrie kWh-ii plătiți (din aplicația stației sau de pe contorul încărcătorului). Dacă încarci de obicei până la 80%, calculul se face pe toată perioada și e marcat „aproximativ”.": "При зарядке указывайте оплаченные кВт·ч (из приложения станции или со счётчика). Если обычно заряжаете до 80%, расчёт ведётся за весь период и помечается «примерно».", "L / 100": "Л / 100", "KWH / 100": "КВТ·Ч / 100", "LEI / 100 KM": "ЛЕЙ / 100 КМ", "Kwh / 100": "Квт·ч / 100", "Lei / 100 km": "Лей / 100 км", "Pe ce merge mașina?": "На чём ездит машина?", "Alimentări în litri": "Заправки в литрах", "Ambele, urmărite separat": "Оба топлива, учёт раздельно", "Se încarcă singur; alimentezi benzină": "Заряжается сам; заправляете бензин", "Benzină și încărcări de la priză": "Бензин и зарядка от розетки", "Doar încărcări (kWh)": "Только зарядки (кВт·ч)", "Alege pe ce merge mașina (benzină, motorină, plug-i ion; stop it there or here.", "Înregistrarea are nevoie de locația precisă (GPS).": "Recording needs precise location (GPS).", "Drumul e prea scurt ca să fie salvat.": "The trip is too short to save.", "Plecare": "Departure", "Sosire": "Arrival", "Distanța": "Distance", "Durata": "Duration", "Viteza medie": "Average speed", "Viteza maximă": "Top speed", "Carburant estimat": "Estimated fuel", "Apare după ce ai cel puțin două alimentări cu plinul.": "Appears after at least two full-tank fuel-ups.", "Șterge drumul": "Delete the trip", "Aproape de mine": "Near me", "Benzinării": "Petrol stations", "Service auto": "Car service", "Vulcanizare": "Tyre service", "Parcări": "Parking", "Drum GPS": "GPS trip", "Înregistrează cu GPS": "Record with GPS", "Înregistrez drumul — atinge ca să vezi harta": "Recording the trip — tap to see the map", "Hărți": "Maps", "Adresa plăcilor de hartă": "Map tile address", "Atribuire": "Attribution", "Salvează setările hărții": "Save map settings", "Adresa trebuie să conțină {z}, {x} și {y}.": "The address must contain {z}, {x} and {y}.", "Hărțile vin de la serverele OpenStreetMap. Pentru o aplicație publicată cu mulți utilizatori, OpenStreetMap cere folosirea altui furnizor: pune aici adresa plăcilor ({z}/{x}/{y}) și textul de atribuire de la furnizor.": "Maps come from the OpenStreetMap servers. For a published app with many users, OpenStreetMap requires another provider: enter the tile address ({z}/{x}/{y}) and the provider's attribution text here.", "Hartă": "Map", "Ulei motor și filtru de ulei": "Engine oil and oil filter", "Filtru de aer": "Air filter", "Filtru de habitaclu": "Cabin filter", "Filtru de combustibil": "Fuel filter", "Bujii": "Spark plugs", "Distribuție (curea/lanț)": "Timing (belt/chain)", "Plăcuțe și discuri de frână (verificare)": "Brake pads and discs (check)", "Lichid de frână": "Brake fluid", "Antigel": "Coolant", "Baterie (verificare)": "Battery (check)", "Anvelope (verificare uzură și presiune)": "Tyres (wear and pre enses", "Drumuri": "Trips", "3 luni": "3 months", "Anul acesta": "This year", "Tot": "All", "Nimic găsit pentru aceste filtre.": "Nothing found for these filters.", "Tot istoricul (căutare și filtre)": "Full history (search and filters)", "Atinge o înregistrare ca s-o modifici; ține apăsat ca s-o ștergi.": "Tap an entry to edit it; hold it to delete.", "Atinge un drum ca să-l vezi sau să-l modifici; ține apăsat ca să-l ștergi. Exportul se deschide în Excel sau Google Sheets.": "Tap a trip to view or edit it; hold it to delete. The export opens in Excel or Google Sheets.", "Editează cheltuiala": "Edit expense", "Editează alimentarea": "Edit fuel-up", "Editează drumul": "Edit trip", "Anul tău cu mașina": "Your year with the car", "Anul meu": "My year", "Kilometri": "Kilometres", "Consum": "Consumption", "Pe luni": "By month", "Cea mai mare cheltuială": "Biggest expense", "ANUL MEU CU MAȘINA": "MY YEAR WITH THE CAR", "Cheltuit": "Spent", "Categorie": "Category", "Descriere": "Description", "Exportă tot în CSV (Excel)": "Export everything to CSV (Excel)", "Ora notificărilor": "Notification time", "Ce notificări primești": "Which notifications you get", "Întreținere": "Maintenance", "Kilometraj (duminica)": "Mileage (Sundays)", "Ajutor și întrebări frecvente": "Help and FAQ", "Șterge toate datele": "Delete all data", "Ștergi toate datele?": "Delete all data?", "Se șterg definitiv toate mașinile, termenele, cheltuielile, drumurile și pozele. Fă înainte o copie de rezervă dacă vrei să le păstrezi.": "All cars, deadlines, expenses, trips and photos will be deleted permanently. Make a backup first if you want to keep them.", "Șterge tot": "Delete everything", "Ești sigur?": "Are you sure?", "Acțiunea nu poate fi anulată.": "This can't be undone.", "Da, șterge tot": "Yes, delete everything", "Bordul și scorul": "Dashboard and score", "Scorul de la 0 la 100 îți arată dintr-o privire dacă documentele, service-ul și kilometrajul sunt la zi. Atinge-l ca să vezi ce să faci ca să ajungi la 100.": "The 0–100 score shows at a glance whether documents, service and mileage are up to date. Tap it to see what to do to reach 100.", "Termene fără grijă": "Worry-free deadlines", "Adaugă RCA, inspecția, Carte Verde. Poți fotografia polița: data se completează singură. Primești notificări din timp.": "Add insurance, inspection, Green Card. You can photograph the policy: the date fills itself in. You get reminders in good time.", "Întreținere și cheltuieli": "Maintenance and expenses", "Planul de întreținere îți spune când urmează uleiul, filtrele sau distribuția. La un service bifezi ce s-a făcut. Cheltuielile se pot importa și din extrasul băncii.": "The maintenance plan tells you when oil, filters or timing are due. At a service you tick what was done. Expenses can also be imported from your bank statement.", "Unelte pentru drum": "Tools for the road", "Înregistrează drumurile cu GPS, salvează locul de parcare, diagnoză OBD-II, cronometru 0–100. Butonul + din mijloc adaugă orice; ține-l apăsat ca să dictezi.": "Record trips with GPS, save your parking spot, OBD-II diagnostics, 0–100 timer. The + button in the middle adds anything; hold it to dictate.", "Următorul": "Next", "Începe": "Start", "Sari peste": "Skip", "Ajutor": "Help", "Întrebări frecvente": "Frequently asked questions", "Vezi din nou turul": "See the tour again", "Unde sunt păstrate datele mele?": "Where is my data kept?", "Doar pe telefonul tău. Aplicația nu are cont și nu are server. Pentru telefon nou folosește Setări → Copie de rezervă.": "Only on your phone. The app has no account and no server. For a new phone use Settings → Backup.", "De ce nu primesc notificări?": "Why don't I get notifications?", "Verifică Setări → Notificări în aplicație și permisiunea de notificări a telefonului. Unele telefoane opresc aplicațiile în fundal: scoate AutoDosar din economisirea bateriei.": "Check Settings → Notifications in the app and the phone's notification permission. Some phones stop apps in the background: exclude AutoDosar from battery saving.", "Cum se calculează consumul real?": "How is real consumption calculated?", "Între două alimentări cu plinul: litrii puși după primul plin împărțiți la kilometrii parcurși. Bifează „Da, plin” când faci plinul.": "Between two full-tank fuel-ups: the litres added after the first full tank divided by the kilometres driven. Tick “Yes, full” when you fill up.", "Ce înseamnă scorul mașinii?": "What does the car score mean?", "Documente valabile (40), service la zi (30), kilometraj actualizat (20), istoric (10). Atinge scorul pe Bord ca să vezi ce lipsește.": "Valid documents (40), service up to date (30), mileage updated (20), history (10). Tap the score on the Dashboard to see what's missing.", "Cum modific o înregistrare greșită?": "How do I fix a wrong entry?", "Atinge-o în Cheltuieli sau în Tot istoricul; se deschide formularul cu butoanele Salvează și Șterge.": "Tap it in Expenses or Full history; the form opens with Save and Delete buttons.", "Ce adaptor OBD-II îmi trebuie?": "Which OBD-II adapter do I need?", "Un adaptor ELM327 cu Bluetooth (nu doar Wi-Fi), împerecheat din setările Bluetooth ale telefonului.": "An ELM327 adapter with Bluetooth (not Wi-Fi only), paired in the phone's Bluetooth settings.", "Cum import cheltuielile din bancă?": "How do I import expenses from my bank?", "Exportă extrasul ca fișier CSV din aplicația băncii, apoi Cheltuieli → Din bancă. Sau, la o plată din aplicația băncii, Partajează → AutoDosar.": "Export the statement as a CSV file from your bank's app, then Expenses → From bank. Or, on a payment in your bank's app, Share → AutoDosar.", "Intervalele de întreținere sunt exacte?": "Are the maintenance intervals exact?", "Sunt orientative. Ajustează-le după manualul mașinii: Întreținere → atinge lucrarea.": "They are approximate. Adjust them to the car's manual: Maintenance → tap the item.", "Golește": "Clear", "Expiră pe": "Expires on", "Data (opțional)": "Date (optional)", "Se afi
